[project]
name = "comfyui-audiovisualizer"
description = "Turn a still image and audio into a spectrum visualizer video with bars or LED dots, using FFmpeg's libraries through PyAV."
version = "0.3.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["av>=17.0.0"]

[project.urls]
Repository = "https://github.com/bno84/ComfyUI-AudioVisualizer"

[tool.comfy]
Icon = "https://raw.githubusercontent.com/bno84/ComfyUI-AudioVisualizer/main/docs/icon.png"
PublisherId = "bno84"
DisplayName = "Audio Visualizer"
"requires-comfyui" = ">=0.38.0"
