name: CI and release

# Every push and pull request runs the checks. A pushed v* tag also publishes
# to the Comfy Registry after required checks pass. macOS runs independently.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMFY_CLI_VERSION: "1.23.0"
  RUFF_VERSION: "0.17.2"
  # Oldest ComfyUI this pack declares in requires-comfyui.
  COMFYUI_REF: v0.38.0

jobs:
  checks:
    timeout-minutes: 5
    name: Metadata, security scan and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Registry metadata (comfy node validate)
        run: |
          pip install "comfy-cli==$COMFY_CLI_VERSION" "ruff==$RUFF_VERSION"
          comfy --skip-prompt --no-enable-telemetry env
          comfy node validate
      - name: Security scan as errors
        # comfy-cli only warns about exec, eval and one-line multi-statements
        # for now and says these will become errors; fail on them already.
        run: ruff check . --select S102,S307,E702
      - name: Frontend unit tests
        run: node --test tests/*.mjs

  render:
    timeout-minutes: 5
    name: Render on ${{ matrix.os }} / Python ${{ matrix.runtime.python }} / av${{ matrix.runtime.av }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime:
          - {python: "3.10", av: "==17.0.0"}
          - {python: "3.12", av: ">=17.0.0"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.runtime.python }}
      - name: Install prebuilt runtime dependencies
        run: >-
          python -m pip install --only-binary=:all: numpy "av${{ matrix.runtime.av }}"
      - name: Real library filter and encoder tests
        run: python -m unittest discover -s tests -v

  # Independent from publish so unavailable macOS runners cannot hold a release.
  render_macos:
    timeout-minutes: 5
    name: Optional macOS render / Python ${{ matrix.runtime.python }} / av${{ matrix.runtime.av }}
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {python: "3.10", av: "==17.0.0"}
          - {python: "3.12", av: ">=17.0.0"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.runtime.python }}
      - name: Install prebuilt runtime dependencies
        run: >-
          python -m pip install --only-binary=:all: numpy "av${{ matrix.runtime.av }}"
      - name: Real library filter and encoder tests
        run: python -m unittest discover -s tests -v

  comfyui:
    timeout-minutes: 5
    name: Loads in ComfyUI (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pack
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ComfyUI with CPU PyTorch
        run: |
          git clone --depth 1 --branch "$COMFYUI_REF" https://github.com/Comfy-Org/ComfyUI.git comfyui
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r comfyui/requirements.txt
          pip install -r pack/requirements.txt
          cp -r pack comfyui/custom_nodes/ComfyUI-AudioVisualizer
      - name: Start ComfyUI and check the pack
        run: >
          python pack/.github/scripts/comfyui_smoke.py comfyui
          --pack ComfyUI-AudioVisualizer --cnr-id comfyui-audiovisualizer
          --node AudioVisualizer
          --route /extensions/ComfyUI-AudioVisualizer/widgets.js
          --route /extensions/ComfyUI-AudioVisualizer/preview.js

  publish:
    timeout-minutes: 5
    name: Publish to the Comfy Registry
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, render, comfyui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Changelog from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:subject)%0a%0a%(contents:body)' > changelog.md
          cat changelog.md
      - name: Publish
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          pip install "comfy-cli==$COMFY_CLI_VERSION" "ruff==$RUFF_VERSION"
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN" --changelog-file changelog.md
